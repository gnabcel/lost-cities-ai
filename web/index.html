<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Cities vs Bot</title>
<meta name="description" content="Play Lost Cities against a self-play-trained bot that runs entirely in your browser.">
<style>
  :root {
    color-scheme: light;
    --page: #f3f1ea;
    --surface: #fcfcfb;
    --table: #e7e3d6;
    --text: #1b1a17;
    --text-2: #55534d;
    --muted: #8a877f;
    --border: rgba(27, 26, 23, 0.14);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.16);
    --good: #0b7a0b;
    --bad: #b8322f;
    --back: #5a4632;
    --back-2: #7a6048;
    /* expedition colors (from the game, fixed in both modes) */
    --c0: #e1b320; --c0-ink: #2b2206;
    --c1: #2f6fc1; --c1-ink: #ffffff;
    --c2: #ecebe4; --c2-ink: #2a2925;
    --c3: #2f8a4c; --c3-ink: #ffffff;
    --c4: #c33c32; --c4-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #11110f;
      --surface: #1c1c1a;
      --table: #262521;
      --text: #f4f3ee;
      --text-2: #c3c2b7;
      --muted: #8f8c84;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #5a9cf0;
      --accent-soft: rgba(90, 156, 240, 0.22);
      --good: #38c038;
      --bad: #ef6b67;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #11110f;
    --surface: #1c1c1a;
    --table: #262521;
    --text: #f4f3ee;
    --text-2: #c3c2b7;
    --muted: #8f8c84;
    --border: rgba(255, 255, 255, 0.12);
    --accent: #5a9cf0;
    --accent-soft: rgba(90, 156, 240, 0.22);
    --good: #38c038;
    --bad: #ef6b67;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 17px; margin: 0; }
  .scoreline { display: flex; gap: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .scoreline b { color: var(--text); }
  header .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .table { background: var(--table); border-radius: 14px; padding: 14px; border: 1px solid var(--border); }
  .seat { display: flex; align-items: center; gap: 10px; min-height: 30px; flex-wrap: wrap; }
  .seat .who { font-weight: 600; }
  .seat .pts { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .backs { display: flex; }
  .backs span { width: 16px; height: 24px; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--back), var(--back) 3px, var(--back-2) 3px, var(--back-2) 6px); border: 1px solid rgba(0,0,0,.25); margin-left: -6px; }
  .backs span:first-child { margin-left: 0; }
  .table > .seat:first-child { min-height: 44px; }
  .known { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; }

  .cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 70px; gap: 8px; }
  .col { display: flex; flex-direction: column; align-items: center; min-height: 40px; border-radius: 10px; padding: 4px 0; }
  .col.target { background: var(--accent-soft); outline: 2px dashed var(--accent); cursor: pointer; }
  .col .colscore { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 16px; }
  .col .colscore.pos { color: var(--good); }
  .col .colscore.neg { color: var(--bad); }
  .stack { display: flex; flex-direction: column; align-items: center; }
  .stack .card + .card { margin-top: -54px; }
  .bot-cols .col { justify-content: flex-end; }

  .middle { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 70px; gap: 8px; align-items: center; margin: 12px 0; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; padding: 4px 0; }
  .pile.target, .deck.target { background: var(--accent-soft); outline: 2px dashed var(--accent); cursor: pointer; }
  .pile .count { font-size: 11px; color: var(--muted); }
  .pile-cards { position: relative; }
  .pile-cards .under { position: absolute; top: 0; left: 0; }
  .slot { width: 56px; height: 80px; border-radius: 8px; border: 2px dashed; opacity: .55; }
  .deck { display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; padding: 4px 0; }
  .deck .back { width: 56px; height: 80px; border-radius: 8px; background: repeating-linear-gradient(45deg, var(--back), var(--back) 6px, var(--back-2) 6px, var(--back-2) 12px); border: 1px solid rgba(0,0,0,.3); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  .card { width: 56px; height: 80px; border-radius: 8px; position: relative; border: 1px solid rgba(0,0,0,.25); box-shadow: 0 1px 2px rgba(0,0,0,.18); flex: none; user-select: none; }
  .card .corner { position: absolute; top: 3px; left: 6px; font-weight: 700; font-size: 15px; line-height: 1; }
  .card .center { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 26px; padding-top: 10px; }
  .card.wager .center { font-size: 30px; }
  .card.sm { width: 30px; height: 42px; border-radius: 5px; }
  .card.sm .corner { display: none; }
  .card.sm .center { font-size: 14px; padding-top: 0; }
  .card.sm.wager .center { font-size: 12px; }
  .c0 { background: var(--c0); color: var(--c0-ink); }
  .c1 { background: var(--c1); color: var(--c1-ink); }
  .c2 { background: var(--c2); color: var(--c2-ink); }
  .c3 { background: var(--c3); color: var(--c3-ink); }
  .c4 { background: var(--c4); color: var(--c4-ink); }

  .hand { display: flex; gap: 18px 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; min-height: 92px; padding-top: 16px; }
  .hand .card { cursor: pointer; transition: transform .12s; }
  .hand .card:hover { transform: translateY(-4px); }
  .hand .card.selected { transform: translateY(-12px); outline: 3px solid var(--accent); outline-offset: 2px; }
  /* the card you just drew: ring + badge */
  .hand .card.new { box-shadow: 0 0 0 2px var(--table), 0 0 0 4px var(--text); }
  .hand .card.new::after { content: "NEW"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); padding: 0 5px; border-radius: 6px; background: var(--text); color: var(--page); font-size: 9px; font-weight: 700; letter-spacing: .05em; line-height: 14px; pointer-events: none; }
  /* motion: a card in flight rides above the table; .ghost is a face-down card in flight */
  .card.flying { z-index: 5; box-shadow: 0 10px 22px rgba(0,0,0,.28); }
  .ghost { position: fixed; z-index: 6; pointer-events: none; border-radius: 8px; border: 1px solid rgba(0,0,0,.3); box-shadow: 0 10px 22px rgba(0,0,0,.28); background: repeating-linear-gradient(45deg, var(--back), var(--back) 6px, var(--back-2) 6px, var(--back-2) 12px); }
  .hand.locked .card { cursor: default; }
  .hand.locked .card:hover { transform: none; }

  .status { text-align: center; margin-top: 18px; min-height: 22px; font-weight: 600; }
  .status .sub { font-weight: 400; color: var(--text-2); }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .log { max-height: 320px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  .log .bot { color: var(--text-2); }
  .log .sep { color: var(--muted); margin-top: 6px; }
  .log .drew { font-weight: 600; }
  .icon { width: 1.1em; height: 1.1em; vertical-align: -0.2em; margin-right: 6px; }
  #btn-hint { width: 100%; }
  #btn-hint.pulse:not(:disabled) { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 10px transparent; } }
  .status .ask { border: none; background: none; padding: 0 0 0 10px; color: var(--accent); font-weight: 600; }
  .status .ask:hover { text-decoration: underline; }

  /* guided tour: a spotlight that slides between parts of the table, with a tip next to it */
  .tour { position: fixed; inset: 0; z-index: 20; }
  .tour-spot { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); pointer-events: none; transition: left .35s ease, top .35s ease, width .35s ease, height .35s ease; }
  .tour-tip { position: fixed; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: 0 12px 32px rgba(0,0,0,.3); animation: tip-in .25s ease-out; }
  .tour-tip .step { font-size: 12px; color: var(--muted); }
  .tour-tip h3 { margin: 2px 0 6px; font-size: 16px; }
  .tour-tip p { margin: 0; color: var(--text-2); }
  .tour-nav { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .tour-nav .skip { border: none; background: none; padding: 6px 0; color: var(--muted); margin-right: auto; }
  @keyframes tip-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tour-spot { transition: none; } .tour-tip, #btn-hint.pulse:not(:disabled) { animation: none; } }
  .hint-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: 13px; }
  .hint-row { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent); margin-top: 3px; }
  .muted { color: var(--muted); font-size: 12px; }
  table.rounds { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  table.rounds td, table.rounds th { padding: 3px 4px; text-align: right; }
  table.rounds td:first-child, table.rounds th:first-child { text-align: left; }
  table.rounds th { color: var(--muted); font-weight: 500; }
  table.rounds tr.total td { border-top: 1px solid var(--border); font-weight: 700; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; padding: 16px; z-index: 10; }
  .overlay.show { display: grid; }
  .dialog { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; border: 1px solid var(--border); }
  .dialog h2 { margin: 0 0 6px; font-size: 20px; }
  .dialog .reveal { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 14px; }
  .dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .options { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  select { font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; text-align: center; }
  @media (max-width: 520px) {
    .card { width: 48px; height: 70px; }
    .stack .card + .card { margin-top: -48px; }
    .slot, .deck .back { width: 48px; height: 70px; }
    .middle, .cols { grid-template-columns: repeat(5, minmax(0, 1fr)) 54px; gap: 4px; }
    .table { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Lost Cities vs Bot</h1>
  <div class="scoreline" id="scoreline"></div>
  <div class="spacer"></div>
  <button id="btn-help">How to play</button>
  <button id="btn-new">New match</button>
</header>

<div class="layout">
  <main class="table">
    <div class="seat">
      <span class="who">Bot</span><span class="pts" id="bot-pts"></span>
      <div class="backs" id="bot-backs"></div>
      <div class="known" id="bot-known"></div>
    </div>
    <div class="cols bot-cols" id="bot-cols"></div>
    <div class="middle" id="middle"></div>
    <div class="cols" id="my-cols"></div>
    <div class="status" id="status"></div>
    <div class="err" id="err"></div>
    <div class="hand" id="hand"></div>
    <div class="seat" style="justify-content:center; margin-top:14px">
      <span class="who">You</span><span class="pts" id="my-pts"></span>
    </div>
  </main>

  <aside>
    <section class="panel">
      <h2>Bot hint</h2>
      <button class="primary" id="btn-hint"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>What would the bot play?</button>
      <div id="hint"></div>
    </section>
    <section class="panel">
      <h2>Rounds</h2>
      <table class="rounds" id="rounds"></table>
    </section>
    <section class="panel">
      <h2>Moves</h2>
      <div class="log" id="log"></div>
    </section>
    <p class="muted" id="model"></p>
  </aside>
</div>

<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';</script>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script src="match.js"></script>
<script>
const COLOR_NAMES = ['Yellow', 'Blue', 'White', 'Green', 'Red'];
const PLAY = 0, DISCARD = 60, DRAW_DECK = 120, DRAW_DISCARD = 121;
let S = null, selected = null, busy = false;
const $ = id => document.getElementById(id);

// api() is defined in match.js: the whole match runs in this page.

function cardEl(c, cls = '') {
  const d = document.createElement('div');
  const txt = c.value === 0 ? '×' : c.value;
  d.className = `card c${c.color} ${c.value === 0 ? 'wager' : ''} ${cls}`;
  d.innerHTML = `<span class="corner">${txt}</span><span class="center">${txt}</span>`;
  d.title = `${COLOR_NAMES[c.color]} ${c.value === 0 ? 'wager' : c.value}`;
  d.dataset.id = c.id;
  return d;
}

const legal = a => S && S.legal.includes(a);
// same-color wagers are interchangeable; the server accepts any of them
const legalCard = (c, off) => legal(off + c.id) ||
  (c.value === 0 && S.hand.some(h => h.value === 0 && h.color === c.color && legal(off + h.id)));

// animate: cards glide from where they were before this render to where they are now
function render(animate = false) {
  const prev = animate && !calm.matches ? snapshot() : null;
  const myTurn = S.turn === 'human' && !S.round_over;
  $('scoreline').innerHTML = `<span>Round <b>${S.round}</b>/${S.rounds}</span>
    <span>Total: you <b>${S.totals[0]}</b> · bot <b>${S.totals[1]}</b></span>`;
  $('bot-pts').textContent = `${S.score.bot >= 0 ? '+' : ''}${S.score.bot} pts this round`;
  $('my-pts').textContent = `${S.score.human >= 0 ? '+' : ''}${S.score.human} pts this round`;
  $('bot-backs').innerHTML = '<span></span>'.repeat(S.bot_hand_count);
  const known = $('bot-known');
  known.innerHTML = S.bot_known.length ? 'you know it holds:' : '';
  S.bot_known.forEach(c => known.appendChild(cardEl(c, 'sm')));

  // expeditions
  for (const [who, box] of [['bot', $('bot-cols')], ['human', $('my-cols')]]) {
    box.innerHTML = '';
    for (let col = 0; col < 5; col++) {
      const d = document.createElement('div');
      d.className = 'col';
      const cards = S.expeditions[who][col];
      const sc = S.exp_scores[who][col];
      const score = document.createElement('div');
      score.className = 'colscore ' + (cards.length ? (sc >= 0 ? 'pos' : 'neg') : '');
      score.textContent = cards.length ? (sc > 0 ? '+' : '') + sc : '';
      const stack = document.createElement('div');
      stack.className = 'stack';
      cards.forEach(c => stack.appendChild(cardEl(c)));
      if (who === 'bot') { d.append(score, stack); } else { d.append(stack, score); }
      if (who === 'human' && myTurn && S.phase === 'play' && selected && selected.color === col && legalCard(selected, PLAY)) {
        d.classList.add('target');
        d.onclick = () => act(PLAY + selected.id);
      }
      box.appendChild(d);
    }
  }

  // discard piles + deck
  const mid = $('middle');
  mid.innerHTML = '';
  S.discards.forEach((p, col) => {
    const d = document.createElement('div');
    d.className = 'pile';
    if (p.top) {
      const cards = document.createElement('div');
      cards.className = 'pile-cards';
      if (p.count > 1) cards.appendChild(cardEl(p.cards[p.count - 2], 'under'));
      cards.appendChild(cardEl(p.top));
      d.appendChild(cards);
    }
    else { const s = document.createElement('div'); s.className = 'slot'; s.style.borderColor = `var(--c${col})`; d.appendChild(s); }
    const cnt = document.createElement('div');
    cnt.className = 'count';
    cnt.textContent = p.count ? `${p.count} ${p.count === 1 ? 'card' : 'cards'}` : 'discard pile';
    d.appendChild(cnt);
    d.title = p.count ? 'Pile: ' + p.cards.map(c => c.value === 0 ? 'wager' : c.value).join(', ') : `Discard pile: ${COLOR_NAMES[col].toLowerCase()}`;
    if (myTurn && S.phase === 'play' && selected && selected.color === col && legalCard(selected, DISCARD)) {
      d.classList.add('target'); d.onclick = () => act(DISCARD + selected.id);
    }
    if (myTurn && S.phase === 'draw' && legal(DRAW_DISCARD + col)) {
      d.classList.add('target'); d.onclick = () => act(DRAW_DISCARD + col);
    }
    mid.appendChild(d);
  });
  const deck = document.createElement('div');
  deck.className = 'deck';
  deck.innerHTML = `<div class="back">${S.deck}</div><div class="count">deck</div>`;
  if (myTurn && S.phase === 'draw') { deck.classList.add('target'); deck.onclick = () => act(DRAW_DECK); }
  mid.appendChild(deck);

  // hand
  const hand = $('hand');
  hand.innerHTML = '';
  hand.classList.toggle('locked', !(myTurn && S.phase === 'play'));
  S.hand.forEach(c => {
    const el = cardEl(c, (selected && selected.id === c.id ? 'selected ' : '') + (c.id === S.last_drawn ? 'new' : ''));
    el.onclick = () => {
      if (!(myTurn && S.phase === 'play')) return;
      selected = selected && selected.id === c.id ? null : c;
      render(true);
    };
    hand.appendChild(el);
  });

  // status
  let st = '';
  if (S.round_over) st = 'Round over';
  else if (!myTurn) st = 'The bot is thinking…';
  else if (S.phase === 'play') st = selected
    ? `${selected.value ? COLOR_NAMES[selected.color] + ' ' + selected.value : COLOR_NAMES[selected.color] + ' wager'}: <span class="sub">click your expedition to play it, or its pile to discard it</span>`
    : 'Your turn: <span class="sub">pick a card from your hand</span>';
  else st = 'Now draw: <span class="sub">from the deck or a discard pile</span>';
  if (myTurn) st += `<button class="ask" id="ask">${$('btn-hint').querySelector('.icon').outerHTML}Ask the bot</button>`;
  $('status').innerHTML = st;
  if (myTurn) $('ask').onclick = showHint;
  $('btn-hint').disabled = !myTurn;
  $('btn-hint').classList.toggle('pulse', !store.get('lc.hintUsed'));

  // rounds
  let rows = '<tr><th></th><th>You</th><th>Bot</th></tr>';
  S.history.forEach((r, i) => rows += `<tr><td>Round ${i + 1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`);
  rows += `<tr class="total"><td>Total</td><td>${S.totals[0]}</td><td>${S.totals[1]}</td></tr>`;
  $('rounds').innerHTML = rows;

  // log
  const log = $('log');
  log.innerHTML = S.log.map(l => `<div class="${l.startsWith('Bot') ? 'bot' : l.startsWith('—') || l.startsWith('End') ? 'sep' : l.startsWith('You drew') || l.startsWith('You took') ? 'drew' : ''}">${l}</div>`).join('');
  log.scrollTop = log.scrollHeight;
  $('model').textContent = `Bot: ${S.model}`;

  if (prev) animateFrom(prev);
  if (S.round_over) showRoundOver(); else $('overlay').classList.remove('show');
}

// --- motion (FLIP): measure every card before a render, then play each one from its old place ---
const calm = matchMedia('(prefers-reduced-motion: reduce)');
const EASE = 'cubic-bezier(.25,.8,.3,1)';
const center = r => [r.left + r.width / 2, r.top + r.height / 2];

function snapshot() {
  const cards = new Map();
  document.querySelectorAll('main.table [data-id]').forEach(el => cards.set(el.dataset.id, el.getBoundingClientRect()));
  const back = $('bot-backs').lastElementChild, deck = document.querySelector('#middle .deck .back');
  return { cards, back: back && back.getBoundingClientRect(), deck: deck && deck.getBoundingClientRect(),
           botCount: $('bot-backs').children.length, deckCount: deck ? +deck.textContent : 0 };
}

// transforms that put an element whose box is `to` over the box `from`, and halfway there;
// long trips go in an arc, short shuffles in a straight line
function path(from, to) {
  const [fx, fy] = center(from), [tx, ty] = center(to);
  const dx = fx - tx, dy = fy - ty, s = from.width / to.width, dist = Math.hypot(dx, dy);
  const lift = dist > 150 ? Math.min(40, dist / 8) : 0;
  return { dx, dy, s, lift, start: `translate(${dx}px, ${dy}px) scale(${s})`,
           mid: `translate(${dx / 2}px, ${dy / 2 - lift}px) scale(${(s + 1) / 2 + (lift ? .06 : 0)})` };
}

function ghostAt(r, radius) {
  const g = document.createElement('div');
  g.className = 'ghost';
  Object.assign(g.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, borderRadius: radius });
  document.body.appendChild(g);
  return g;
}

// a face-up card moves from `from` to its place
function glide(el, from) {
  const p = path(from, el.getBoundingClientRect());
  if (Math.abs(p.dx) < 1 && Math.abs(p.dy) < 1 && Math.abs(p.s - 1) < .01) return;
  const frames = p.lift ? [{ transform: p.start }, { transform: p.mid }, { transform: 'none' }] : [{ transform: p.start }, { transform: 'none' }];
  if (p.lift) el.classList.add('flying');
  el.animate(frames, { duration: p.lift ? 420 : 260, easing: EASE }).finished
    .then(() => el.classList.remove('flying'), () => {});
}

// a face-down card leaves `from`, turns over halfway and lands face up on el
function reveal(el, from) {
  const to = el.getBoundingClientRect(), p = path(from, to);
  const turned = `${p.mid} scaleX(0)`, timing = { duration: 560, easing: EASE };
  const g = ghostAt(to, '8px');
  g.animate([{ transform: p.start }, { transform: turned, offset: .5 }, { transform: turned }], timing).finished
    .then(() => g.remove(), () => g.remove());
  el.classList.add('flying');
  el.animate([{ transform: turned }, { transform: turned, offset: .5 }, { transform: 'none' }], timing).finished
    .then(() => el.classList.remove('flying'), () => {});
}

// the bot drew from the deck: a face-down card goes up into its hand
function toBotHand(from) {
  const back = $('bot-backs').lastElementChild;
  if (!back || !from) return;
  const to = back.getBoundingClientRect(), p = path(from, to), g = ghostAt(to, '3px');
  back.style.visibility = 'hidden';
  const done = () => { g.remove(); back.style.visibility = ''; };
  g.animate([{ transform: p.start }, { transform: p.mid }, { transform: 'none' }], { duration: 460, easing: EASE }).finished.then(done, done);
}

function animateFrom(prev) {
  document.querySelectorAll('main.table [data-id]').forEach(el => {
    const was = prev.cards.get(el.dataset.id);
    if (was) glide(el, was);
    else if (el.classList.contains('under')) return;  // uncovered in a pile: it was there all along
    else if (el.closest('#hand')) { if (prev.deck) reveal(el, prev.deck); }  // you drew from the deck
    else if (prev.back) reveal(el, prev.back);  // the bot played a card from its hidden hand
  });
  const deck = document.querySelector('#middle .deck .back');
  if (deck && +deck.textContent < prev.deckCount && S.bot_hand_count > prev.botCount) toBotHand(prev.deck);
}

function showRoundOver() {
  const [h, b] = S.history[S.history.length - 1];
  const dlg = $('dialog');
  const verdict = h > b ? 'You won the round!' : h < b ? 'The bot won the round' : 'Tie';
  let html = `<h2>${verdict}</h2><p>You <b>${h}</b> · Bot <b>${b}</b></p>`;
  if (S.match_over) {
    const [th, tb] = S.totals;
    html = `<h2>${th > tb ? 'You won the match! 🎉' : th < tb ? 'The bot won the match' : 'Match tied'}</h2>
      <p>Total: you <b>${th}</b> · bot <b>${tb}</b></p>` + `<p class="muted">Last round: you ${h} · bot ${b}</p>`;
  }
  html += `<div class="muted">The bot's hand was:</div><div class="reveal" id="reveal"></div>`;
  html += `<div class="actions">${S.match_over ? '<button class="primary" id="dlg-new">Play again</button>' : '<button class="primary" id="dlg-next">Next round</button>'}</div>`;
  dlg.innerHTML = html;
  (S.bot_hand || []).forEach(c => $('reveal').appendChild(cardEl(c, 'sm')));
  if (S.match_over) $('dlg-new').onclick = openNew;
  else $('dlg-next').onclick = async () => { S = await api('/api/next_round', {}); selected = null; render(); runBot(); };
  $('overlay').classList.add('show');
}

function openNew() {
  $('dialog').innerHTML = `<h2>New match</h2>
    <div class="options">
      <label>Rounds <select id="opt-rounds"><option>1</option><option>2</option><option selected>3</option></select></label>
      <label>Goes first <select id="opt-starts"><option value="human">you</option><option value="bot">the bot</option></select></label>
    </div>
    <p class="muted">You're playing the best bot trained so far. Before each move it imagines 64 possible deals of the cards it can't see and simulates how the round ends with its best options.</p>
    <div class="actions"><button id="dlg-cancel">Cancel</button><button class="primary" id="dlg-go">Start</button></div>`;
  $('overlay').classList.add('show');
  $('dlg-cancel').onclick = () => { $('overlay').classList.remove('show'); if (S.round_over) render(); };
  $('dlg-go').onclick = async () => {
    S = await api('/api/new', { rounds: +$('opt-rounds').value, starts: $('opt-starts').value });
    selected = null; $('hint').innerHTML = ''; render(); runBot();
  };
}

async function act(a) {
  if (busy) return;
  $('err').textContent = '';
  try {
    S = await api('/api/action', { action: a });
    selected = null;
    $('hint').innerHTML = '';
    render(true);
    runBot();
  } catch (e) { $('err').textContent = e.message; }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runBot() {
  if (busy) return;
  busy = true;
  try {
    while (S.turn === 'bot' && !S.round_over) {
      await sleep(550);
      S = await api('/api/bot', {});
      render(true);
    }
  } finally { busy = false; }
}

$('btn-new').onclick = openNew;
$('btn-help').onclick = () => tour(0);
$('btn-hint').onclick = showHint;
async function showHint() {
  store.set('lc.hintUsed', '1');
  $('btn-hint').classList.remove('pulse');
  const h = await api('/api/hint');
  const box = $('hint');
  if (!h.options || !h.options.length) { box.innerHTML = '<p class="muted">Not available for this bot.</p>'; return; }
  box.innerHTML = `<div class="hint-list">${h.options.map(o => `
    <div class="hint-row"><div>${o.text}<div class="bar" style="width:${Math.max(4, o.prob * 100)}%"></div></div>
    <div style="text-align:right">${Math.round(o.prob * 100)}%</div></div>`).join('')}</div>
    <p class="muted">The bot expects you to finish the round ${h.value >= 0 ? 'ahead' : 'behind'} by ~${Math.abs(h.value)} pts.</p>`;
  const r = box.closest('.panel').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) box.closest('.panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// localStorage can be missing or blocked (private windows); the page works without it
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// --- guided tour: on the first visit, and from "How to play" ---
const TOUR = [
  { title: 'Welcome!', text: 'This bot learned Lost Cities by playing against itself, over and over, with the same recipe as AlphaGo: a neural network plus a look-ahead search. Normal rules; the best total after the rounds wins.' },
  { target: () => [$('my-cols'), $('hand')], title: 'Play a card', text: 'Click a card in your hand, then click its column to play it, or its discard pile to throw it away.' },
  { target: () => [$('middle')], title: 'Draw a card', text: 'Then take the top card of the deck or of any discard pile. The card you just drew is marked NEW.' },
  { target: () => [$('btn-hint').closest('.panel')], title: 'Stuck? Ask the bot', text: 'It shows what it would play in your place, and whether it thinks you’ll win the round. You can also use “Ask the bot” next to the instructions.' },
];
let tourAt = -1;

function tour(i) {
  if (i < 0 || i >= TOUR.length) return endTour();
  if (tourAt < 0) {
    const box = document.createElement('div');
    box.id = 'tour'; box.className = 'tour';
    box.innerHTML = '<div class="tour-spot"></div>';
    document.body.appendChild(box);
    addEventListener('resize', placeTour); addEventListener('scroll', placeTour, true); addEventListener('keydown', tourKeys);
  }
  tourAt = i;
  const step = TOUR[i], last = i === TOUR.length - 1;
  $('tour').querySelector('.tour-tip')?.remove();
  const tip = document.createElement('div');
  tip.className = 'tour-tip'; tip.setAttribute('role', 'dialog');
  tip.innerHTML = `<div class="step">${i + 1} of ${TOUR.length}</div><h3>${step.title}</h3><p>${step.text}</p>
    <div class="tour-nav"><button class="skip" id="tour-skip">${last ? '' : 'Skip'}</button>
    ${i ? '<button id="tour-back">Back</button>' : ''}<button class="primary" id="tour-next">${last ? 'Let’s play' : 'Next'}</button></div>`;
  $('tour').appendChild(tip);
  $('tour-skip').onclick = endTour;
  if (i) $('tour-back').onclick = () => tour(i - 1);
  $('tour-next').onclick = () => tour(i + 1);
  $('tour-next').focus();
  const els = step.target ? step.target() : [];
  if (els.length) els[els.length - 1].scrollIntoView({ block: 'center', behavior: 'instant' });
  placeTour();
}

function endTour() {
  $('tour')?.remove();
  tourAt = -1;
  removeEventListener('resize', placeTour); removeEventListener('scroll', placeTour, true); removeEventListener('keydown', tourKeys);
  store.set('lc.tourDone', '1');
}

function tourKeys(e) {
  if (e.key === 'Escape') endTour();
  else if (e.key === 'ArrowRight') tour(tourAt + 1);
  else if (e.key === 'ArrowLeft' && tourAt > 0) tour(tourAt - 1);
}

// spotlight around the step's target (nothing to point at: dim everything) and the tip below or above it
function placeTour() {
  const box = $('tour');
  if (!box) return;
  const spot = box.querySelector('.tour-spot'), tip = box.querySelector('.tour-tip');
  const els = TOUR[tourAt].target ? TOUR[tourAt].target() : [], vw = innerWidth, vh = innerHeight, pad = 8, gap = 12;
  let r = { left: vw / 2, right: vw / 2, top: vh / 2, bottom: vh / 2 };
  if (els.length) {
    const rs = els.map(e => e.getBoundingClientRect());
    r = { left: Math.min(...rs.map(x => x.left)) - pad, right: Math.max(...rs.map(x => x.right)) + pad,
          top: Math.min(...rs.map(x => x.top)) - pad, bottom: Math.max(...rs.map(x => x.bottom)) + pad };
  }
  Object.assign(spot.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.right - r.left}px`, height: `${r.bottom - r.top}px` });
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const top = !els.length ? (vh - th) / 2
    : r.bottom + gap + th <= vh - 16 ? r.bottom + gap
    : r.top - gap - th >= 16 ? r.top - gap - th
    : vh - th - 16;
  const left = Math.max(16, Math.min(vw - tw - 16, (r.left + r.right) / 2 - tw / 2));
  Object.assign(tip.style, { left: `${left}px`, top: `${top}px` });
}

(async () => {
  $('status').textContent = 'Loading the bot (3 MB)…';
  try { S = await api('/api/state'); } catch (e) { $('status').textContent = `Couldn't load the bot: ${e.message}`; return; }
  render(); runBot();
  if (!store.get('lc.tourDone')) tour(0);
})();
</script>
</body>
</html>
